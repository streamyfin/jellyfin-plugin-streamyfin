name: Watch for a new Jellyfin line

# The 12.0 packages appeared on NuGet before anyone here noticed, and the plugin spent
# three days compiling against a release candidate that had been superseded. Renovate is
# deliberately turned off for Jellyfin's own packages, because the reference is a floor
# rather than a version to keep current, so this is the only thing looking.
#
# Two feeds, because Jellyfin uses two. Releases go to nuget.org; the weekly builds of
# master go to GitHub Packages, and that is where a new line appears first. Reading only
# nuget.org, which this did at first, meant 13.0.0-20260914101923 could sit there from
# 2026-09-14 without a word. Compat/README.md has the full map.
#
# It looks once a day and opens an issue the first time a version the build does not know
# about is published. It reads and touches nothing else.
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-watch
  cancel-in-progress: true

jobs:
  look:
    name: Jellyfin.Controller on NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: read

    steps:
      # develop, explicitly, rather than whatever branch this runs from. A scheduled
      # workflow runs from the default branch, and the thing being compared against is
      # "what this repository builds", which is decided in develop's Directory.Build.props
      # while the rewrite is in flight. Named here so the same file behaves the same on
      # both branches.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"

      # The comparison used to be `cut -d. -f1 | sort -u` here, which reads major numbers
      # and is blind to everything else: 12.1.0 was published on 2026-09-15 and this said
      # nothing, because 12 was already a known major. It is a tested script now, since
      # the interesting cases are prereleases and ordering rather than shell.
      # GITHUB_TOKEN reads the prerelease feed, which refuses anonymous requests even
      # for a public package. If that read fails the script says so in the report and
      # carries on with the releases, rather than turning the job red every morning.
      - name: Compare what is published against what is built
        id: look
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          report=$(node scripts/jellyfin-watch.js)
          echo "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Say so, once
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          REPORT: ${{ steps.look.outputs.report }}
        with:
          script: |
            const { newLines, newerInLine, newest, built, unreadable, prereleaseOnly, headline } =
              JSON.parse(process.env.REPORT);

            // Losing sight of the prerelease feed is the failure this watch is least
            // able to notice, since it looks exactly like nothing being published.
            if (unreadable) {
              core.warning(`The prerelease feed was not read: ${unreadable}`);
            }

            if (newLines.length === 0 && newerInLine.length === 0) {
              core.info(`Nothing newer than ${newest} is published.`);
              return;
            }

            // The newest version is in the title so that a later one opens its own issue
            // rather than reopening the one that was closed as read. Only that one, with a
            // count beside it: the title is what the search below looks for, and GitHub
            // refuses a search past 256 characters, which naming every version reached the
            // day a line started publishing weekly builds. The full list is in the body.
            const title = headline;

            // This runs every day, so the same news must not become an issue a day.
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} in:title "${title}" type:issue`,
            });
            if (existing.data.total_count > 0) {
              core.info(`Already said: #${existing.data.items[0].number}`);
              return;
            }

            const body = [`This repository builds against **${built.join('** and **')}**.`, ''];

            const onlyPrerelease = new Set(prereleaseOnly);
            const mark = (v) => (onlyPrerelease.has(v) ? `${v} (prerelease feed only)` : v);

            if (newLines.length > 0) {
              body.push(
                `### A line nothing here builds against: ${newLines.map(mark).join(', ')}`,
                '',
                'This is the one that needs a new target. The procedure is four steps, written down in',
                '[`Jellyfin.Plugin.Streamyfin/Compat/README.md`](../blob/develop/Jellyfin.Plugin.Streamyfin/Compat/README.md#adding-a-jellyfin-line-when-the-time-comes),',
                'along with the two things worth checking before assuming a target is only a version number.',
                '',
                'A prerelease counts: the first build of a line on the prerelease feed is the moment a',
                'target for it becomes possible at all. It is not the moment it becomes worth having, since',
                'that feed needs a token and its packages are replaced weekly. Compat/README.md weighs both.',
                '',
              );
            }

            if (newerInLine.length > 0) {
              body.push(
                `### Newer inside a line already built: ${newerInLine.map(mark).join(', ')}`,
                '',
                'Usually nothing to do. The reference is the oldest server each target supports, and a',
                'newer server satisfies a lower reference, so raising it only narrows who can install the',
                'plugin. It is worth reading the release for two things: whether the host moved its EF Core',
                'pin, since the server provides that assembly and a plugin ahead of its host fails to load,',
                'and whether anything the plugin calls changed inside the line, the way `IUserManager.Users`',
                'became `GetUsers()` in 10.11.9.',
                '',
              );
            }

            body.push('Opened automatically by `nuget-watch.yml`. Closing it is the right answer once it has been read.');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['dependencies'],
              body: body.join('\n'),
            });
