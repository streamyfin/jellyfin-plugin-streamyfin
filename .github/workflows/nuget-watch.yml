name: Watch for a new Jellyfin line

# The 12.0 packages appeared on NuGet before anyone here noticed, and the plugin spent
# three days compiling against a release candidate that had been superseded. Renovate is
# deliberately turned off for Jellyfin's own packages, because the reference is a floor
# rather than a version to keep current, so this is the only thing looking.
#
# Two feeds, because Jellyfin uses two. Releases go to nuget.org; the weekly builds of
# master go to GitHub Packages, and that is where a new line appears first. Reading only
# nuget.org, which this did at first, meant 13.0.0-20260914101923 could sit there from
# 2026-09-14 without a word. Compat/README.md has the full map.
#
# It looks once a day and opens an issue the first time a version the build does not know
# about is published. It reads and touches nothing else.
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-watch
  cancel-in-progress: true

jobs:
  look:
    name: Jellyfin.Controller on NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: read

    steps:
      # develop, explicitly, rather than whatever branch this runs from. A scheduled
      # workflow runs from the default branch, and the thing being compared against is
      # "what this repository builds", which is decided in develop's Directory.Build.props
      # while the rewrite is in flight. Named here so the same file behaves the same on
      # both branches.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"

      # The comparison used to be `cut -d. -f1 | sort -u` here, which reads major numbers
      # and is blind to everything else: 12.1.0 was published on 2026-09-15 and this said
      # nothing, because 12 was already a known major. It is a tested script now, since
      # the interesting cases are prereleases and ordering rather than shell.
      # GITHUB_TOKEN reads the prerelease feed, which refuses anonymous requests even
      # for a public package. If that read fails the script says so in the report and
      # carries on with the releases, rather than turning the job red every morning.
      - name: Compare what is published against what is built
        id: look
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          report=$(node scripts/jellyfin-watch.js)
          echo "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Say so, once
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          REPORT: ${{ steps.look.outputs.report }}
        with:
          script: |
            const report = JSON.parse(process.env.REPORT);
            const { newLines, newerInLine, newest, unreadable } = report;

            // From the checkout rather than from the report, so the title cannot drift from
            // the versions it names: this file comes from the branch the run was started on
            // while the scripts come from develop, which is what the checkout above pins.
            const { headline, issueBody, planIssue } = require('./scripts/jellyfin-versions');

            // Losing sight of the prerelease feed is the failure this watch is least
            // able to notice, since it looks exactly like nothing being published.
            if (unreadable) {
              core.warning(`The prerelease feed was not read: ${unreadable}`);
            }

            if (newLines.length === 0 && newerInLine.length === 0) {
              core.info(`Nothing newer than ${newest} is published.`);
              return;
            }

            // The newest version is in the title, with a count beside it and not the whole
            // list, which is in the body. A title that names the newest build is how an issue
            // closed as read tells the same news from newer news.
            const title = headline(report);
            const body = issueBody(report);
            const { owner, repo } = context.repo;

            // One issue, kept up to date, rather than one per weekly build. planIssue says
            // which, from every issue this watch opened, open or closed.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              labels: 'dependencies',
              per_page: 100,
            });
            const plan = planIssue({ title, body, issues, partial: Boolean(unreadable) });

            if (plan.update) {
              await github.rest.issues.update({ owner, repo, issue_number: plan.update, title, body });
              core.info(`Brought #${plan.update} up to date`);
            } else if (plan.create) {
              const { data } = await github.rest.issues.create({ owner, repo, title, labels: ['dependencies'], body });
              core.info(`Opened #${data.number}`);
            } else {
              core.info(plan.reason);
            }

            for (const number of plan.close) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: `Superseded by #${plan.keep}, which this watch keeps up to date.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: number, state: 'closed', state_reason: 'not_planned' });
            }
