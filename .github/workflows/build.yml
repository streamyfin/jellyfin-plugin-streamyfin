name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

# A new push supersedes the one before it on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a pull request adds to the dependency tree, before it is merged. The scheduled
  # scan in security.yml reads what is already there; this reads what is arriving, and
  # it is the only one that can run on a fork's pull request, since it needs no write.
  dependencies:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      # Both targets always report. Knowing only that jf11 broke, while jf12 was
      # cancelled, means running the whole thing again to learn the other half.
      fail-fast: false
      matrix:
        include:
          - target: jf11
            dotnet: 9.0.x
          - target: jf12
            dotnet: 10.0.x

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ matrix.dotnet }}

      # JellyfinTarget picks the framework and the package versions, so every
      # command needs it. Leave it off one of them and that step silently works
      # on the default target instead.
      - name: Restore
        run: dotnet restore -p:JellyfinTarget=${{ matrix.target }}

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:JellyfinTarget=${{ matrix.target }}

      - name: Test
        run: dotnet test Jellyfin.Plugin.Streamyfin.Tests --configuration Release --no-build -p:JellyfinTarget=${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"

      # The release chain used to be exercised only by cutting a release. That is
      # how a zip path pinned to net9.0 survived unnoticed: nothing ever built the
      # other target's package. Packaging now runs on every pull request, with a
      # placeholder version since a pull request checkout has no tags.
      #
      # Both channels, for the same reason. Only one of the two is exercised by cutting
      # a release, so an unstable publish that fails on its own manifest would otherwise
      # be found by whoever ran it first.
      - name: Package
        env:
          VERSION: 0.0.0.0
        run: |
          make zip JELLYFIN_TARGET=${{ matrix.target }}
          make update-manifest JELLYFIN_TARGET=${{ matrix.target }} DRY_RUN=1
          make update-manifest JELLYFIN_TARGET=${{ matrix.target }} DRY_RUN=1 CHANNEL=unstable

      # The zip a release ships, unpacked. An artifact is downloaded as a zip of what it
      # holds, so this hands whoever tries the branch the files a release would, rather
      # than the one DLL: the assemblies beside it are required, and the translations live
      # in folders under it.
      - name: Stage what a release would ship
        env:
          VERSION: 0.0.0.0
        run: unzip -q "dist/streamyfin-$VERSION-${{ matrix.target }}.zip" -d "dist/plugin-${{ matrix.target }}"

      - name: Upload plugin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Jellyfin.Plugin.Streamyfin-${{ matrix.target }}
          path: dist/plugin-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  # A reviewer who wants to try a pull request should not have to build it, and should not
  # have to open the run to learn whether there is anything to download yet. The comment
  # carries a row per Jellyfin line: where its build is, and the file once it exists.
  #
  # Written twice. Once beside the builds, so the pull request says something while they
  # run, and once after them with what they produced. Both renders read the run as it is at
  # that moment, so one that starts late is still right, and the marker at the bottom of the
  # comment stops an earlier render from undoing a later one.
  #
  # Only for a branch in this repository: a fork's pull request gets a read only token
  # whatever the permissions below say, so the job would fail rather than stay quiet.
  comment-start:
    name: say the build has started
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const comment = require('./scripts/build-comment.js')
            await comment.post({ github, context, core })

  comment:
    name: point at the build
    needs: build
    # always(), so a failed build is reported as failed rather than leaving the comment
    # saying the two are still running.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const comment = require('./scripts/build-comment.js')
            await comment.post({ github, context, core })

  # The JavaScript this repository owns: the admin pages, which only a browser runs and
  # which get a test DOM here, and the release scripts. Once, since nothing in either
  # depends on the Jellyfin target.
  #
  # --frozen-lockfile is the lockfile check as well as the install: it fails when
  # package.json asks for something bun.lock does not carry, which is how a dependency
  # gets added in a pull request and resolved differently on the next machine.
  pages:
    name: pages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install, and check the lockfile agrees with package.json
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test
