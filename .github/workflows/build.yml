name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

# A new push supersedes the one before it on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      # Both targets always report. Knowing only that jf11 broke, while jf12 was
      # cancelled, means running the whole thing again to learn the other half.
      fail-fast: false
      matrix:
        include:
          - target: jf11
            dotnet: 9.0.x
          - target: jf12
            dotnet: 10.0.x

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      # JellyfinTarget picks the framework and the package versions, so every
      # command needs it. Leave it off one of them and that step silently works
      # on the default target instead.
      - name: Restore
        run: dotnet restore -p:JellyfinTarget=${{ matrix.target }}

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:JellyfinTarget=${{ matrix.target }}

      - name: Test
        run: dotnet test Jellyfin.Plugin.Streamyfin.Tests --configuration Release --no-build -p:JellyfinTarget=${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      # The release chain used to be exercised only by cutting a release. That is
      # how a zip path pinned to net9.0 survived unnoticed: nothing ever built the
      # other target's package. Packaging now runs on every pull request, with a
      # placeholder version since a pull request checkout has no tags.
      - name: Package
        env:
          VERSION: 0.0.0.0
        run: |
          make zip JELLYFIN_TARGET=${{ matrix.target }}
          make update-manifest JELLYFIN_TARGET=${{ matrix.target }} DRY_RUN=1

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.Streamyfin-${{ matrix.target }}
          path: Jellyfin.Plugin.Streamyfin/bin/Release/*/Jellyfin.Plugin.Streamyfin.dll
          if-no-files-found: error
          retention-days: 7

  # The admin pages are JavaScript that only a browser runs. Their tests run under a
  # test DOM, once, since nothing in them depends on the Jellyfin target.
  pages:
    name: pages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test
