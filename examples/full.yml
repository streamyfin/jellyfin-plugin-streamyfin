# Full Configuration Example for Streamyfin Plugin
# You can remove any settings you do not need configured.

# Format:
# settingName:
#   locked: true | false  # If true, prevents user modification in app. Default: false
#   value: <value>        # The value you want to set. Editor provides type suggestions.

# This example shows ALL supported settings.

settings:
  # ==================== Media Playback Controls ====================
  forwardSkipTime:
    locked: false
    value: 15  # Seconds to skip forward (0-60)
  
  rewindSkipTime:
    locked: false
    value: 10  # Seconds to skip backward (0-60)
  
  defaultBitrate:
    locked: false
    value: null  # null = Max quality, or specify bitrate (e.g., 250000, 500000, 1000000, 2000000)
  
  maxAutoPlayEpisodeCount:
    locked: false
    value: 3  # Maximum episodes to autoplay (1-10)

  # ==================== Media Segment Skip ====================
  # Every type takes: none (never skip), ask (show a skip button), auto (skip on its own)
  skipIntro:
    locked: false
    value: ask  # Intro segments

  skipOutro:
    locked: false
    value: ask  # Outro / credits segments

  skipRecap:
    locked: false
    value: ask  # Recap segments

  skipCommercial:
    locked: false
    value: ask  # Commercial segments

  skipPreview:
    locked: false
    value: ask  # Preview segments

  # ==================== Audio Settings ====================
  rememberAudioSelections:
    locked: false
    value: true  # Remember audio language from previous playback

  # ==================== Subtitle Settings ====================
  subtitleMode:
    locked: false
    value: Default  # Options: Default, Always, OnlyForced, None, Smart
  
  rememberSubtitleSelections:
    locked: false
    value: true  # Remember subtitle language from previous playback
  
  subtitlesOnMute:
    locked: false
    value: true  # Turn subtitles on automatically while the sound is off
  
  subtitlesOnMuteAllowRestart:
    locked: false
    value: false  # Allow subtitle formats that need the server to re-process the stream
  
  subtitleSize:
    locked: false
    value: 100  # Subtitle size percentage (0-120)
  
  subtitleFont:
    locked: false
    value: System  # Font family used to render subtitles
  
  subtitleColor:
    locked: false
    value: "#FFFFFF"  # Subtitle text colour
  
  subtitleBackground:
    locked: false
    value: false  # Draw a box behind the subtitles
  
  subtitleBackgroundOpacity:
    locked: false
    value: 60  # 0 to 100
  
  subtitleBackgroundPadding:
    locked: false
    value: 8
  
  subtitleMarginY:
    locked: false
    value: 25  # Distance from the edge of the video
  
  subtitleAlignX:
    locked: false
    value: center  # left, center or right
  
  subtitleAlignY:
    locked: false
    value: bottom  # top, center or bottom

  # ==================== Video Orientation ====================
  defaultVideoOrientation:
    locked: false
    value: Default  # Options: Default, PortraitUp, Landscape, LandscapeLeft, LandscapeRight

  # ==================== UI & Controls ====================
  safeAreaInControlsEnabled:
    locked: false
    value: true  # Enable safe area for video controls
  
  showCustomMenuLinks:
    locked: false
    value: false  # Show custom menu links from Jellyfin web configuration
  
  disableHapticFeedback:
    locked: false
    value: false  # Disable haptic/vibration feedback

  # ==================== Swipe Gesture Controls ====================
  enableHorizontalSwipeSkip:
    locked: false
    value: true  # Enable swipe left/right to skip
  
  enableLeftSideBrightnessSwipe:
    locked: false
    value: true  # Enable left side swipe for brightness control
  
  enableRightSideVolumeSwipe:
    locked: false
    value: true  # Enable right side swipe for volume control

  hideVolumeSlider:
    locked: false
    value: false  # Hide the volume slider in the video controls

  hideBrightnessSlider:
    locked: false
    value: false  # Hide the brightness slider in the video controls
  
  enableDoubleTapToSeek:
    locked: false
    value: false
  
  enableHoldToSpeed:
    locked: false
    value: true
  
  holdToSpeedRate:
    locked: false
    value: 2.0  # Speed multiplier while the screen is held
  
  enablePinchToZoom:
    locked: false
    value: true
  
  showResumeDialog:
    locked: false
    value: false  # Ask resume or start over
  
  autoPlayEpisodeCount:
    locked: false
    value: 0
  
  playDefaultAudioTrack:
    locked: false
    value: true
  
  audioTranscodeMode:
    locked: false
    value: auto  # auto, stereo, 5.1 or passthrough
  # Hide the brightness slider in the video controls

  # ==================== Library Management ====================
  hiddenLibraries:
    locked: false
    value:
      []  # Array of library IDs to hide from users
  
  libraryOptions:
    locked: false
    value:
      display: list  # Options: list, row
      cardStyle: detailed  # Options: detailed, compact
      imageStyle: cover  # Options: cover, poster
      showTitles: true
      showStats: true

  # ==================== Third-Party Integrations ====================
  
  # Jellyseerr (Media Request Management)
  jellyseerrServerUrl:
    locked: false
    value: ""  # e.g., https://jellyseerr.example.com
  # Optional: Seerr admin API key (Seerr Settings > General). Lets Streamyfin
  # sign each user in to Seerr without a password (works with Quick Connect).
  # WARNING: every authenticated Jellyfin user can read this key and it grants
  # full admin access to the Seerr API. Only set it if you trust all users.
  # jellyseerrApiKey:
  #   locked: true
  #   value: "your-seerr-api-key"
  
  # Marlin (Enhanced Search)
  searchEngine:
    locked: false
    value: Jellyfin  # Options: Jellyfin, Marlin, Streamystats
  
  marlinServerUrl:
    locked: false
    value: ""  # e.g., https://marlin.example.com
  
  # Streamystats (Recommendations & Analytics)
  streamyStatsServerUrl:
    locked: false
    value: "Enter Streamystats server URL"  # e.g., https://stats.example.com
  
  streamyStatsMovieRecommendations:
    locked: false
    value: false  # Enable movie recommendations
  
  streamyStatsSeriesRecommendations:
    locked: false
    value: false  # Enable series recommendations
  
  streamyStatsPromotedWatchlists:
    locked: false
    value: false  # Enable promoted watchlists

  hideWatchlistsTab:
    locked: false
    value: false  # Hide the Streamystats watchlists tab in the app

  # KefinTweaks
  useKefinTweaks:
    locked: false
    value: false  # Enable the KefinTweaks watchlist integration

  usePopularPlugin:
    locked: false
    value: true  # Popular Lists plugin
  
  wikidataAwardsEnabled:
    locked: false
    value: true
  
  openSubtitlesEnabled:
    locked: false
    value: true
  
  autoLoginJellyseerr:
    locked: false
    value: true
  
  # No default is shipped. The app follows the device language until the user
  # picks one, so setting this imposes a language on everyone who never chose.
  preferedLanguage:
    locked: false
    value: en
  
  mediaListCollectionIds:
    locked: false
    value: []  # Collection ids
  
  showDownloadLiveActivity:
    locked: false
    value: true
  
  enableH265ForChromecast:
    locked: false
    value: false  # Only some Chromecast models decode HEVC

  # ==================== TV and player ====================
  tvTypographyScale:
    locked: false
    value: default  # small, default, large or extraLarge
  
  tvThemeMusicEnabled:
    locked: false
    value: true
  
  hideRemoteSessionButton:
    locked: false
    value: false
  
  inactivityTimeout:
    locked: false
    value: 0  # Milliseconds. 0 never signs out
  
  nativeVideoPlayerTV:
    locked: false
    value: true  # Apple TV
  
  nativeVideoPlayerAndroidTV:
    locked: false
    value: false
  
  # No default is shipped for this one. The app picks a player at runtime so an
  # existing install keeps what it has been using. Set it only to decide for
  # everyone, including devices that never chose.
  videoPlayer:
    locked: false
    value: 0  # 0 mpv, 1 ExoPlayer (Android TV only), 2 native

  # ==================== Playback & Audio ====================
  autoPlayNextEpisode:
    locked: false
    value: true  # Automatically start the next episode when one finishes

  defaultPlaybackSpeed:
    locked: false
    value: 1.0  # Default video playback speed multiplier

  preferLocalAudio:
    locked: false
    value: true  # Prefer downloaded audio over streaming when available

  audioLookaheadEnabled:
    locked: false
    value: true  # Pre-cache upcoming tracks for gapless music playback

  audioLookaheadCount:
    locked: false
    value: 1  # How many upcoming tracks to pre-cache

  audioMaxCacheSizeMB:
    locked: false
    value: 500  # Maximum disk space (MB) for audio look-ahead caching

  # ==================== Home Screen Composition ====================
  showHomeTitles:
    locked: false
    value: true  # Show the title under each card
  
  showHomeBackdrop:
    locked: false
    value: true
  
  showHeroCarousel:
    locked: false
    value: true  # The large rotating carousel at the top
  
  hiddenHomeHeroSections:
    locked: false
    value: []  # continueWatching, nextUp, recentlyAdded
  
  hiddenHomeHeroMediaTypes:
    locked: false
    value: []  # movie, tv
  
  mergeNextUpAndContinueWatching:
    locked: false
    value: false  # One row instead of two
  
  useEpisodeImagesForNextUp:
    locked: false
    value: false  # Episode image rather than series poster
  
  showSeriesPosterOnEpisode:
    locked: false
    value: false

  # ==================== Custom Home Screen ====================
  home:
    locked: false
    value:
      sections:
        # Continue Watching Section
        - title: Continue Watching
          orientation: horizontal # Options: vertical, horizontal
          custom:
            endpoint: /UserItems/Resume

        # Next Up Section (TV Shows)
        - title: Next Up
          orientation: horizontal
          nextUp:
            limit: 25
            enableResumable: true
            enableRewatching: false

        # Recently Added Section
        - title: Recently Added
          orientation: vertical
          items:
            sortBy:
              - DateCreated
            sortOrder:
              - Descending
            # Jellyfin's own item kind names, not the words used in the UI.
            # A collection is a BoxSet, a folder is a Folder, a music album is a
            # MusicAlbum. Common values: Movie, Series, Season, Episode, BoxSet,
            # Playlist, MusicAlbum, MusicArtist, Audio, Book, Photo, PhotoAlbum,
            # LiveTvChannel, LiveTvProgram, Folder, CollectionFolder.
            # A name that is not one of these is ignored rather than reported,
            # so the section simply comes back with the wrong contents.
            # The full list is served at GET /streamyfin/config/schema.
            includeItemTypes:
              - Series
              - Movie
            limit: 25

        # Latest Episodes (Grouped)
        - title: Latest Episodes
          orientation: horizontal
          latest:
            limit: 25
            groupItems: true  # Groups episodes by series
            includeItemTypes:
              - Episode

        # Favorites Section
        - title: Favorites
          orientation: vertical
          items:
            sortBy:
              - SortName
            sortOrder:
              - Ascending
            filters:
              - IsFavorite
            includeItemTypes:
              - Series
              - Movie
            limit: 25

        # Collection Example
        # Use with https://github.com/lostb1t/jellyfin-plugin-collection-import
        - title: My Collection
          orientation: horizontal
          items:
            parentId: "your-collection-id-here"  # Find in web UI collection URL
            includeItemTypes:
              - Movie
              - Series
            limit: 20

        # Genre Filter Example
        - title: Action Movies
          orientation: vertical
          items:
            genres:
              - Action
            includeItemTypes:
              - Movie
            sortBy:
              - CommunityRating
            sortOrder:
              - Descending
            limit: 30

        # Custom Endpoint Example (Advanced)
        # - title: Custom Data
        #   custom:
        #     endpoint: "/Users/{UserId}/Items"
        #     query:
        #       Limit: "20"
        #       Recursive: "true"
        #     headers:
        #       X-Custom-Header: "value"

# ==================== Notifications Configuration ====================
# Configure push notification settings
notifications:
  SessionStarted:
    Enabled: true  # Notify when users start sessions (admin only)
  
  PlaybackStarted:
    Enabled: true  # Notify when playback starts (admin only)
  
  UserLockedOut:
    Enabled: true  # Notify on account lockouts
  
  ItemAdded:
    Enabled: true
    recentEventThreshold: null
    enabledLibraries: []    # Notify when new content is added
    # Episodes are automatically grouped by season to reduce spam
