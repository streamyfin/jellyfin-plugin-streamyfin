<div data-role="page" class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-button,emby-input,emby-checkbox"
     data-controller="__plugin/Notifications.js">
    <link rel="stylesheet" href="configurationpage?name=settings-form.css">

    <div class="content-primary sf-page" id="sf-app" data-sf-theme="dark">
        <div class="sf-top">
            <h1>Streamyfin</h1>
            <span class="sf-meta" id="sf-meta">Notifications</span>
        </div>

        <div class="sf-banner">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 7.2v4M8 4.8v.6"/></svg>
            <div>
                These are Jellyfin's own events, sent to the phones and tablets signed in to this
                server. Something else can post a notification instead, which
                <a target="_blank" rel="noreferrer"
                   href="https://github.com/streamyfin/jellyfin-plugin-streamyfin/blob/main/NOTIFICATIONS.md">NOTIFICATIONS.md</a>
                describes.
                <span class="sf-key">Endpoint <span id="notification-endpoint"></span></span>
            </div>
        </div>

        <div class="sf-status" id="sf-status">Loading the events…</div>
        <div id="sf-editor"></div>

        <div class="sf-dock" id="sf-dock" hidden>
            <span class="sf-dock-text"><span class="sf-dot" id="sf-dot" hidden></span><span id="sf-dock-summary">Nothing to save</span></span>
            <button type="button" class="sf-btn sf-btn--primary" id="save-notification-btn" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>
                <span>Save changes</span>
            </button>
        </div>
    </div>
</div>
